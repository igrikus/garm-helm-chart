name: "CI"

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  operator-image:
    name: "Operator image"
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(main): release ')
    permissions:
      contents: "read"
      packages: "write"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Login to GHCR"
        if: "github.event_name == 'pull_request'"
        uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build and push operator image"
        uses: "docker/build-push-action@v6"
        with:
          context: "operator"
          file: "operator/Dockerfile"
          push: "${{ github.event_name == 'pull_request' }}"
          tags: "ghcr.io/igrikus/garm-operator:pr-${{ github.event.pull_request.number }}"

  generated-artifacts:
    name: "Generated artifacts"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Set up Go"
        uses: "actions/setup-go@v5"
        with:
          go-version-file: "operator/go.mod"
          cache-dependency-path: "operator/go.sum"

      - name: "Regenerate operator artifacts"
        working-directory: "operator"
        run: "make generate manifests"

      - name: "Fail if generated artifacts are stale"
        run: |
          git diff --exit-code -- \
            crds \
            operator/api/v1alpha1/zz_generated.deepcopy.go \
            operator/config/rbac
