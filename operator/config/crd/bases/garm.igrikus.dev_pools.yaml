---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pools.garm.igrikus.dev
spec:
  group: garm.igrikus.dev
  names:
    categories:
    - garm
    kind: Pool
    listKind: PoolList
    plural: pools
    shortNames:
    - gpool
    singular: pool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.id
      name: ID
      type: string
    - jsonPath: .spec.minIdleRunners
      name: Min
      type: integer
    - jsonPath: .spec.maxRunners
      name: Max
      type: integer
    - jsonPath: .spec.providerName
      name: Provider
      type: string
    - jsonPath: .spec.scopeRef.kind
      name: Scope
      type: string
    - jsonPath: .spec.scopeRef.name
      name: ScopeName
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PoolSpec configures a runner pool. A pool is bound to one forge (ForgeRef)
              and one entity scope (ScopeRef: GiteaOrganization | Repository | Enterprise).
            properties:
              enabled:
                default: true
                type: boolean
              extraSpecs:
                description: ExtraSpecs is a provider-specific JSON blob, passed verbatim
                  to GARM.
                x-kubernetes-preserve-unknown-fields: true
              flavor:
                type: string
              forgeRef:
                description: ForgeRef points at a forge endpoint CR in the same namespace.
                properties:
                  kind:
                    enum:
                    - GiteaEndpoint
                    - GithubEndpoint
                    type: string
                  name:
                    type: string
                required:
                - kind
                - name
                type: object
              githubRunnerGroup:
                description: GithubRunnerGroup is GitHub-only; ignored for Gitea pools.
                type: string
              imageRef:
                description: |-
                  ImageRef points at an Image CR in the same namespace. Indirection makes
                  "bump every pool to a new image" a single edit.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              maxRunners:
                default: 5
                format: int32
                type: integer
              minIdleRunners:
                default: 0
                format: int32
                type: integer
              osArch:
                default: amd64
                description: OSArch is the CPU arch of pool runners.
                enum:
                - amd64
                - arm64
                type: string
              osType:
                default: linux
                description: OSType is the OS family of pool runners.
                enum:
                - linux
                - windows
                type: string
              priority:
                default: 0
                format: int32
                type: integer
              providerName:
                description: ProviderName is the GARM provider this pool dispatches
                  to (lxd, gcp, ...).
                type: string
              runnerBootstrapTimeoutMinutes:
                default: 20
                format: int32
                type: integer
              runnerInstallTemplateRef:
                description: RunnerInstallTemplateRef references a runner install
                  template by name (managed elsewhere).
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              runnerPrefix:
                type: string
              scopeRef:
                description: 'ScopeRef points at the entity that owns a Pool: an organization,
                  repository, or enterprise CR.'
                properties:
                  kind:
                    enum:
                    - GiteaOrganization
                    - Repository
                    - Enterprise
                    type: string
                  name:
                    type: string
                required:
                - kind
                - name
                type: object
              tags:
                items:
                  type: string
                type: array
            required:
            - flavor
            - forgeRef
            - imageRef
            - providerName
            - scopeRef
            type: object
            x-kubernetes-validations:
            - message: minIdleRunners must be <= maxRunners
              rule: self.minIdleRunners <= self.maxRunners
          status:
            description: PoolStatus reports observed pool state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: ID is the GARM-assigned UUID. Empty before the first
                  successful sync.
                type: string
              idleRunners:
                description: IdleRunners is the count of currently idle runners. Surfaced
                  for the scale subresource.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled
                  by the controller.
                format: int64
                type: integer
              selector:
                description: Selector is consumed by the scale subresource. Always
                  empty for now (no label selection).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.minIdleRunners
        statusReplicasPath: .status.idleRunners
      status: {}
