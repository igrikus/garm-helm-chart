{{- if and .Values.operator.enabled .Values.operator.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "garm.controllerServiceAccountName" . }}
  labels:
    {{- include "garm.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.operator.serviceAccount.automount }}
{{- end }}
