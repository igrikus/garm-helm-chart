    key: {{ required (printf "forges.github.enterprises[%s].webhookSecretRef.key is required" $name) .key | quote }}
  {{- end }}
{{- end }}
{{- range $pool := .Values.forges.github.pools }}
{{- $name := required "forges.github.pools[].name is required" $pool.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: Pool
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  forgeRef:
    kind: GithubEndpoint
    name: {{ required (printf "forges.github.pools[%s].endpointName is required" $name) $pool.endpointName | quote }}
  scopeRef:
    {{ if $pool.enterpriseName }}
    kind: Enterprise
    name: {{ $pool.enterpriseName | quote }}
    {{- else }}
    kind: Repository
    name: {{ required (printf "forges.github.pools[%s].repositoryName or enterpriseName is required" $name) $pool.repositoryName | quote }}
    {{- end }}
  providerName: {{ required (printf "forges.github.pools[%s].providerName is required" $name) $pool.providerName | quote }}
  image: {{ required (printf "forges.github.pools[%s].image is required" $name) $pool.image | quote }}
  flavor: {{ required (printf "forges.github.pools[%s].flavor is required" $name) $pool.flavor | quote }}
  osType: {{ default "linux" $pool.osType | quote }}
  osArch: {{ default "amd64" $pool.osArch | quote }}
  {{- with $pool.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minIdleRunners: {{ default 0 $pool.minIdleRunners }}
  maxRunners: {{ default 5 $pool.maxRunners }}
  enabled: {{ if hasKey $pool "enabled" }}{{ $pool.enabled }}{{ else }}true{{ end }}
  runnerBootstrapTimeoutMinutes: {{ default 20 $pool.runnerBootstrapTimeoutMinutes }}
  runnerPrefix: {{ $name | quote }}
  {{- with $pool.githubRunnerGroup }}
  githubRunnerGroup: {{ . | quote }}
  {{- end }}
  priority: {{ default 0 $pool.priority }}
  {{- $templateName := coalesce $pool.runnerInstallTemplateName $pool.runnerInstallTemplate }}
  {{- with $templateName }}
  runnerInstallTemplateRef:
    name: {{ . | quote }}
  {{- end }}
  {{- with $pool.extraSpec }}
  extraSpecs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
