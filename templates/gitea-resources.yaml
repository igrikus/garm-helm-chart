{{- range $endpoint := .Values.forges.gitea.endpoints }}
{{- $name := required "forges.gitea.endpoints[].name is required" $endpoint.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: GiteaEndpoint
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  baseURL: {{ required (printf "forges.gitea.endpoints[%s].baseURL is required" $name) $endpoint.baseURL | quote }}
  {{- with $endpoint.apiBaseURL }}
  apiBaseURL: {{ . | quote }}
  {{- end }}
  {{- with $endpoint.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- with $endpoint.toolsMetadataURL }}
  toolsMetadataURL: {{ . | quote }}
  {{- end }}
  {{- if hasKey $endpoint "useInternalToolsMetadata" }}
  useInternalToolsMetadata: {{ $endpoint.useInternalToolsMetadata }}
  {{- end }}
  {{- with $endpoint.caCertBundleSecretRef }}
  caCertBundleSecretRef:
    name: {{ required (printf "forges.gitea.endpoints[%s].caCertBundleSecretRef.name is required" $name) .name | quote }}
    key: {{ required (printf "forges.gitea.endpoints[%s].caCertBundleSecretRef.key is required" $name) .key | quote }}
  {{- end }}
{{- end }}
{{- range $credentials := .Values.forges.gitea.credentials }}
{{- $name := required "forges.gitea.credentials[].name is required" $credentials.name }}
{{- $patSecretRef := required (printf "forges.gitea.credentials[%s].patSecretRef is required" $name) $credentials.patSecretRef }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: GiteaCredentials
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  endpointRef:
    name: {{ required (printf "forges.gitea.credentials[%s].endpointName is required" $name) $credentials.endpointName | quote }}
  {{- with $credentials.description }}
  description: {{ . | quote }}
  {{- end }}
  patSecretRef:
    name: {{ required (printf "forges.gitea.credentials[%s].patSecretRef.name is required" $name) $patSecretRef.name | quote }}
    key: {{ required (printf "forges.gitea.credentials[%s].patSecretRef.key is required" $name) $patSecretRef.key | quote }}
{{- end }}
{{- range $org := .Values.forges.gitea.organizations }}
{{- $name := required "forges.gitea.organizations[].name is required" $org.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: GiteaOrganization
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  endpointRef:
    name: {{ required (printf "forges.gitea.organizations[%s].endpointName is required" $name) $org.endpointName | quote }}
  credentialsRef:
    name: {{ required (printf "forges.gitea.organizations[%s].credentialsName is required" $name) $org.credentialsName | quote }}
  name: {{ default $name $org.organizationName | quote }}
  {{- with $org.poolBalancerType }}
  poolBalancerType: {{ . | quote }}
  {{- end }}
  {{- if hasKey $org "installWebhook" }}
  installWebhook: {{ $org.installWebhook }}
  {{- end }}
  {{- with $org.webhookInsecureSSL }}
  webhookInsecureSSL: {{ . }}
  {{- end }}
  {{- with $org.webhookSecretRef }}
  webhookSecretRef:
    name: {{ required (printf "forges.gitea.organizations[%s].webhookSecretRef.name is required" $name) .name | quote }}
    key: {{ required (printf "forges.gitea.organizations[%s].webhookSecretRef.key is required" $name) .key | quote }}
  {{- end }}
{{- end }}
{{- range $repo := .Values.forges.gitea.repositories }}
{{- $name := required "forges.gitea.repositories[].name is required" $repo.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: Repository
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  forgeRef:
    kind: GiteaEndpoint
    name: {{ required (printf "forges.gitea.repositories[%s].endpointName is required" $name) $repo.endpointName | quote }}
  credentialsRef:
    name: {{ required (printf "forges.gitea.repositories[%s].credentialsName is required" $name) $repo.credentialsName | quote }}
  owner: {{ required (printf "forges.gitea.repositories[%s].owner is required" $name) $repo.owner | quote }}
  name: {{ required (printf "forges.gitea.repositories[%s].repositoryName is required" $name) $repo.repositoryName | quote }}
  {{- with $repo.poolBalancerType }}
  poolBalancerType: {{ . | quote }}
  {{- end }}
  {{- if hasKey $repo "installWebhook" }}
  installWebhook: {{ $repo.installWebhook }}
  {{- end }}
  {{- with $repo.webhookInsecureSSL }}
  webhookInsecureSSL: {{ . }}
  {{- end }}
  {{- with $repo.webhookSecretRef }}
  webhookSecretRef:
    name: {{ required (printf "forges.gitea.repositories[%s].webhookSecretRef.name is required" $name) .name | quote }}
    key: {{ required (printf "forges.gitea.repositories[%s].webhookSecretRef.key is required" $name) .key | quote }}
  {{- end }}
{{- end }}
{{- range $pool := .Values.forges.gitea.pools }}
{{- $name := required "forges.gitea.pools[].name is required" $pool.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: Pool
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  forgeRef:
    kind: GiteaEndpoint
    name: {{ required (printf "forges.gitea.pools[%s].endpointName is required" $name) $pool.endpointName | quote }}
  scopeRef:
    {{ if $pool.repositoryName }}
    kind: Repository
    name: {{ $pool.repositoryName | quote }}
    {{- else }}
    kind: GiteaOrganization
    name: {{ required (printf "forges.gitea.pools[%s].organizationName is required" $name) $pool.organizationName | quote }}
    {{- end }}
  providerName: {{ required (printf "forges.gitea.pools[%s].providerName is required" $name) $pool.providerName | quote }}
  image: {{ required (printf "forges.gitea.pools[%s].image is required" $name) $pool.image | quote }}
  flavor: {{ required (printf "forges.gitea.pools[%s].flavor is required" $name) $pool.flavor | quote }}
  osType: {{ default "linux" $pool.osType | quote }}
  osArch: {{ default "amd64" $pool.osArch | quote }}
  {{- with $pool.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  minIdleRunners: {{ default 0 $pool.minIdleRunners }}
  maxRunners: {{ default 5 $pool.maxRunners }}
  enabled: {{ if hasKey $pool "enabled" }}{{ $pool.enabled }}{{ else }}true{{ end }}
  runnerBootstrapTimeoutMinutes: {{ default 20 $pool.runnerBootstrapTimeoutMinutes }}
  runnerPrefix: {{ $name | quote }}
  priority: {{ default 0 $pool.priority }}
  {{- $templateName := coalesce $pool.runnerInstallTemplateName $pool.runnerInstallTemplate }}
  {{- with $templateName }}
  runnerInstallTemplateRef:
    name: {{ . | quote }}
  {{- end }}
  {{- with $pool.extraSpec }}
  extraSpecs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range $endpoint := .Values.forges.github.endpoints }}
{{- $name := required "forges.github.endpoints[].name is required" $endpoint.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: GithubEndpoint
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  baseURL: {{ required (printf "forges.github.endpoints[%s].baseURL is required" $name) $endpoint.baseURL | quote }}
  {{- with $endpoint.apiBaseURL }}
  apiBaseURL: {{ . | quote }}
  {{- end }}
  {{- with $endpoint.uploadBaseURL }}
  uploadBaseURL: {{ . | quote }}
  {{- end }}
  {{- with $endpoint.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- with $endpoint.caCertBundleSecretRef }}
  caCertBundleSecretRef:
    name: {{ required (printf "forges.github.endpoints[%s].caCertBundleSecretRef.name is required" $name) .name | quote }}
    key: {{ required (printf "forges.github.endpoints[%s].caCertBundleSecretRef.key is required" $name) .key | quote }}
  {{- end }}
{{- end }}
{{- range $credentials := .Values.forges.github.credentials }}
{{- $name := required "forges.github.credentials[].name is required" $credentials.name }}
{{- $authType := default "pat" $credentials.authType }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: GithubCredentials
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  endpointRef:
    name: {{ required (printf "forges.github.credentials[%s].endpointName is required" $name) $credentials.endpointName | quote }}
  {{- with $credentials.description }}
  description: {{ . | quote }}
  {{- end }}
  authType: {{ $authType | quote }}
  {{- if eq $authType "app" }}
  {{- $appAuth := required (printf "forges.github.credentials[%s].appAuth is required when authType is app" $name) $credentials.appAuth }}
  appAuth:
    appID: {{ required (printf "forges.github.credentials[%s].appAuth.appID is required" $name) $appAuth.appID }}
    installationID: {{ required (printf "forges.github.credentials[%s].appAuth.installationID is required" $name) $appAuth.installationID }}
    privateKeySecretRef:
      name: {{ required (printf "forges.github.credentials[%s].appAuth.privateKeySecretRef.name is required" $name) $appAuth.privateKeySecretRef.name | quote }}
      key: {{ required (printf "forges.github.credentials[%s].appAuth.privateKeySecretRef.key is required" $name) $appAuth.privateKeySecretRef.key | quote }}
  {{- else }}
  {{- $patSecretRef := required (printf "forges.github.credentials[%s].patSecretRef is required when authType is pat" $name) $credentials.patSecretRef }}
  patSecretRef:
    name: {{ required (printf "forges.github.credentials[%s].patSecretRef.name is required" $name) $patSecretRef.name | quote }}
    key: {{ required (printf "forges.github.credentials[%s].patSecretRef.key is required" $name) $patSecretRef.key | quote }}
  {{- end }}
{{- end }}
{{- range $repo := .Values.forges.github.repositories }}
{{- $name := required "forges.github.repositories[].name is required" $repo.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: Repository
metadata:
  name: {{ $name }}
  labels:
    {{- include "garm.labels" $ | nindent 4 }}
spec:
  forgeRef:
    kind: GithubEndpoint
    name: {{ required (printf "forges.github.repositories[%s].endpointName is required" $name) $repo.endpointName | quote }}
  credentialsRef:
    name: {{ required (printf "forges.github.repositories[%s].credentialsName is required" $name) $repo.credentialsName | quote }}
  owner: {{ required (printf "forges.github.repositories[%s].owner is required" $name) $repo.owner | quote }}
  name: {{ required (printf "forges.github.repositories[%s].repositoryName is required" $name) $repo.repositoryName | quote }}
  {{- with $repo.poolBalancerType }}
  poolBalancerType: {{ . | quote }}
  {{- end }}
  {{- if hasKey $repo "installWebhook" }}
  installWebhook: {{ $repo.installWebhook }}
  {{- end }}
  {{- with $repo.webhookInsecureSSL }}
  webhookInsecureSSL: {{ . }}
  {{- end }}
  {{- with $repo.webhookSecretRef }}
  webhookSecretRef:
    name: {{ required (printf "forges.github.repositories[%s].webhookSecretRef.name is required" $name) .name | quote }}
    key: {{ required (printf "forges.github.repositories[%s].webhookSecretRef.key is required" $name) .key | quote }}
  {{- end }}
{{- end }}
{{- range $enterprise := .Values.forges.github.enterprises }}
{{- $name := required "forges.github.enterprises[].name is required" $enterprise.name }}
---
apiVersion: garm.igrikus.dev/v1alpha1
kind: Enterprise
metadata:
  name: {{ $name }}
  labels:
